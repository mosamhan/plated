<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Plated wordmark — light tile. Requires Fraunces (600 SemiBold) to render
    as designed; falls back to the viewer's serif if unavailable.
    Reference for assets/images/icon.png.

    Type is sized to the same proportion the splash tile uses (font-size is
    18.5% of the tile), so the mark on the home screen and the mark on the
    launch screen read as the same size.

    NOTE: the shipped PNGs are produced by scripts/generate-brand-assets.py,
    which renders from the Fraunces TTF in node_modules. This SVG is the
    design reference; the script is the source of truth.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4B12A"/>
      <stop offset="1" stop-color="#D9830B"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <text x="512" y="563" text-anchor="middle" font-family="Fraunces, serif" font-weight="600"
        font-size="190" letter-spacing="-5.1" fill="#F8EFD8">Plated</text>
</svg>
